name: Deploy Odoo 19

on:
  push:
    branches: [ odoo-19 ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to ${{ matrix.server }}
    runs-on: [self-hosted, "${{ matrix.server }}"]
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        server: [odoo-server-1, odoo-server-2]

    concurrency:
      group: deploy-${{ matrix.server }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          chmod +x entrypoint.sh
          mkdir -p postgresql addons

      - name: Restart containers
        run: |
          docker compose down
          docker compose up -d

      - name: Wait for Odoo
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:10019/web/login > /dev/null; then
              echo "Odoo is up"
              exit 0
            fi
            echo "waiting... ($i)"
            sleep 5
          done
          exit 1

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Status
        if: always()
        run: docker compose ps