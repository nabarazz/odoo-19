services:

  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo19@2025
      - POSTGRES_DB=postgres
    restart: always
    volumes:
      - ./postgresql:/var/lib/postgresql/18/docker

  odoo19:
    image: odoo:19
    depends_on:
      - db
    ports:
      - "10019:8069"
      - "20019:8072"
    tty: true
    command: --
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo19@2025
      - PIP_BREAK_SYSTEM_PACKAGES=1
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./addons:/mnt/extra-addons
      - ./odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
    restart: always